<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </radialGradient>
    
    <!-- Enhanced glow effects -->
    <filter id="serverGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="clientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Dynamic connection gradient -->
    <linearGradient id="connectionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="25%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6ee7b7;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.3" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;100 0;0 0" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
    
    <!-- Pulsing effect -->
    <filter id="pulse">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
      <animate attributeName="stdDeviation" values="3;8;3" dur="2s" repeatCount="indefinite"/>
    </filter>
    
    <!-- Circuit pattern -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M20,5 L20,15 M5,20 L15,20 M25,20 L35,20 M20,25 L20,35" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
      <circle cx="20" cy="20" r="2" fill="#3b82f6" opacity="0.5"/>
    </pattern>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Circuit background pattern -->
  <rect width="800" height="600" fill="url(#circuit)" opacity="0.4"/>
  
  <!-- Animated background particles -->
  <g id="particles">
    <circle cx="100" cy="100" r="1" fill="#3b82f6" opacity="0.6">
      <animate attributeName="cy" values="100;500;100" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="150" r="1.5" fill="#10b981" opacity="0.5">
      <animate attributeName="cx" values="200;600;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="1" fill="#f59e0b" opacity="0.7">
      <animate attributeName="cy" values="80;520;80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title with enhanced styling -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" filter="url(#pulse)">
    TCP Socket Connection
  </text>
  <text x="400" y="75" text-anchor="middle" fill="#34d399" font-family="Arial, sans-serif" font-size="16">
    Single Client-Server Architecture
  </text>
  
  <!-- Enhanced Server -->
  <g id="server">
    <!-- Server base with 3D effect -->
    <rect x="320" y="180" width="160" height="140" fill="#1f2937" stroke="#374151" stroke-width="3" rx="12"/>
    <rect x="330" y="190" width="140" height="120" fill="#ef4444" stroke="#dc2626" stroke-width="2" rx="8" filter="url(#serverGlow)">
      <animate attributeName="fill" values="#ef4444;#f87171;#ef4444" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Server screen with animations -->
    <rect x="345" y="210" width="110" height="70" fill="#000000" stroke="#16a34a" stroke-width="2" rx="6"/>
    <rect x="350" y="215" width="100" height="60" fill="#22c55e" rx="4">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Server status lights -->
    <circle cx="360" cy="225" r="3" fill="#10b981">
      <animate attributeName="fill" values="#10b981;#34d399;#10b981" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="375" cy="225" r="3" fill="#3b82f6">
      <animate attributeName="fill" values="#3b82f6;#60a5fa;#3b82f6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="225" r="3" fill="#f59e0b">
      <animate attributeName="fill" values="#f59e0b;#fbbf24;#f59e0b" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Server ports with glowing effect -->
    <g id="ports">
      <circle cx="340" cy="300" r="6" fill="#fbbf24" filter="url(#pulse)"/>
      <circle cx="360" cy="300" r="6" fill="#fbbf24" filter="url(#pulse)"/>
      <circle cx="380" cy="300" r="6" fill="#fbbf24" filter="url(#pulse)"/>
      <circle cx="400" cy="300" r="6" fill="#fbbf24" filter="url(#pulse)"/>
      <circle cx="420" cy="300" r="6" fill="#fbbf24" filter="url(#pulse)"/>
      <circle cx="440" cy="300" r="6" fill="#fbbf24" filter="url(#pulse)"/>
      <circle cx="460" cy="300" r="6" fill="#fbbf24" filter="url(#pulse)"/>
    </g>
    
    <!-- Server labels with enhanced styling -->
    <text x="400" y="345" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold" filter="url(#serverGlow)">
      TCP SERVER
    </text>
    <text x="400" y="365" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      IP: 192.168.1.100
    </text>
    <text x="400" y="385" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Port: 8080
    </text>
    <text x="400" y="405" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="14">
      STATUS: LISTENING
    </text>
  </g>
  
  <!-- Enhanced Client -->
  <g id="client">
    <!-- Client base with 3D effect -->
    <rect x="80" y="200" width="140" height="100" fill="#1f2937" stroke="#374151" stroke-width="3" rx="12"/>
    <rect x="90" y="210" width="120" height="80" fill="#06b6d4" stroke="#0891b2" stroke-width="2" rx="8" filter="url(#clientGlow)">
      <animate attributeName="fill" values="#06b6d4;#0ea5e9;#06b6d4" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Client screen -->
    <rect x="105" y="225" width="90" height="50" fill="#000000" stroke="#0ea5e9" stroke-width="2" rx="4"/>
    <rect x="110" y="230" width="80" height="40" fill="#0ea5e9" rx="3">
      <animate attributeName="fill" values="#0ea5e9;#38bdf8;#0ea5e9" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Client activity indicator -->
    <circle cx="120" cy="240" r="2" fill="#10b981">
      <animate attributeName="fill" values="#10b981;#34d399;#10b981" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="130" y="245" fill="#ffffff" font-family="Arial, sans-serif" font-size="8">ACTIVE</text>
    
    <!-- Client labels -->
    <text x="150" y="320" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" filter="url(#clientGlow)">
      TCP CLIENT
    </text>
    <text x="150" y="340" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      IP: 192.168.1.101
    </text>
    <text x="150" y="355" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Port: 3421
    </text>
    <text x="150" y="375" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="12">
      CONNECTED
    </text>
  </g>
  
  <!-- Enhanced Socket Connection -->
  <g id="connection">
    <!-- Main connection line with enhanced effects -->
    <line x1="220" y1="250" x2="320" y2="250" stroke="url(#connectionGrad)" stroke-width="8" opacity="0.8"/>
    <line x1="220" y1="250" x2="320" y2="250" stroke="#34d399" stroke-width="4" opacity="0.6">
      <animate attributeName="stroke-width" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Socket label with background -->
    <rect x="240" y="220" width="80" height="25" fill="rgba(0,0,0,0.8)" stroke="#10b981" stroke-width="2" rx="12"/>
    <text x="280" y="237" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      SOCKET
    </text>
    
    <!-- Animated data packets with enhanced effects -->
    <g id="dataPackets">
      <circle cx="230" cy="250" r="6" fill="#34d399" filter="url(#pulse)">
        <animate attributeName="cx" values="220;320;220" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="250" r="5" fill="#6ee7b7" filter="url(#pulse)">
        <animate attributeName="cx" values="220;320;220" dur="2.2s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="r" values="5;8;5" dur="2.2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="270" cy="250" r="4" fill="#a7f3d0" filter="url(#pulse)">
        <animate attributeName="cx" values="220;320;220" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>
    
    <!-- Data flow indicators -->
    <text x="280" y="275" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      DATA TRANSMISSION
    </text>
  </g>
  
  <!-- Enhanced Legend -->
  <g id="legend">
    <rect x="500" y="450" width="280" height="130" fill="rgba(0,0,0,0.85)" stroke="#374151" stroke-width="2" rx="12" filter="url(#clientGlow)"/>
    <text x="640" y="475" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
      NETWORK LEGEND
    </text>
    
    <!-- Server legend -->
    <rect x="520" y="485" width="30" height="20" fill="#ef4444" rx="3" filter="url(#serverGlow)"/>
    <text x="560" y="500" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TCP Server (Listening)</text>
    
    <!-- Client legend -->
    <rect x="520" y="510" width="30" height="20" fill="#06b6d4" rx="3" filter="url(#clientGlow)"/>
    <text x="560" y="525" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TCP Client (Connected)</text>
    
    <!-- Socket legend -->
    <line x1="520" y1="545" x2="550" y2="545" stroke="#10b981" stroke-width="6"/>
    <text x="560" y="550" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Socket Connection</text>
    
    <!-- Data legend -->
    <circle cx="535" cy="565" r="6" fill="#34d399" filter="url(#pulse)"/>
    <text x="560" y="570" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Data Packets</text>
  </g>
  
  <!-- Status indicator -->
  <g id="status">
    <rect x="50" y="450" width="200" height="80" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="2" rx="10"/>
    <text x="150" y="475" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      CONNECTION STATUS
    </text>
    <circle cx="130" cy="490" r="5" fill="#10b981">
      <animate attributeName="fill" values="#10b981;#34d399;#10b981" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="145" y="495" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      ESTABLISHED
    </text>
    <text x="150" y="515" text-anchor="middle" fill="#34d399" font-family="Arial, sans-serif" font-size="14">
      Handshake Complete ✓
    </text>
  </g>
</svg>