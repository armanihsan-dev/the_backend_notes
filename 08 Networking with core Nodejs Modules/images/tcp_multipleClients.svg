<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Server glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Connection line gradient -->
    <linearGradient id="connectionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">TCP Server-Client Socket Architecture</text>
  
  <!-- Server -->
  <g id="server">
    <!-- Server body -->
    <rect x="350" y="150" width="100" height="120" fill="#ef4444" stroke="#dc2626" stroke-width="2" rx="8" filter="url(#glow)"/>
    
    <!-- Server screen -->
    <rect x="360" y="170" width="80" height="50" fill="#22c55e" stroke="#16a34a" stroke-width="1" rx="4"/>
    
    <!-- Server ports -->
    <circle cx="365" cy="285" r="4" fill="#fbbf24"/>
    <circle cx="385" cy="285" r="4" fill="#fbbf24"/>
    <circle cx="405" cy="285" r="4" fill="#fbbf24"/>
    <circle cx="425" cy="285" r="4" fill="#fbbf24"/>
    <circle cx="445" cy="285" r="4" fill="#fbbf24"/>
    
    <!-- Server label -->
    <text x="400" y="310" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">TCP Server</text>
    <text x="400" y="330" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="14">IP: 192.168.1.100</text>
    <text x="400" y="350" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="14">Port: 8080</text>
  </g>
  
  <!-- Client 1 -->
  <g id="client1">
    <rect x="50" y="80" width="80" height="60" fill="#06b6d4" stroke="#0891b2" stroke-width="2" rx="6"/>
    <rect x="60" y="95" width="60" height="30" fill="#0ea5e9" rx="3"/>
    <text x="90" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client 1</text>
    <text x="90" y="175" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-size="10">192.168.1.101:3421</text>
    
    <!-- Socket connection -->
    <line x1="130" y1="110" x2="350" y2="190" stroke="url(#connectionGrad)" stroke-width="3"/>
    <text x="240" y="145" fill="#10b981" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Socket 1</text>
    
    <!-- Data packets -->
    <circle cx="180" cy="138" r="3" fill="#34d399">
      <animate attributeName="cx" values="130;350;130" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;190;110" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Client 2 -->
  <g id="client2">
    <rect x="50" y="250" width="80" height="60" fill="#06b6d4" stroke="#0891b2" stroke-width="2" rx="6"/>
    <rect x="60" y="265" width="60" height="30" fill="#0ea5e9" rx="3"/>
    <text x="90" y="330" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client 2</text>
    <text x="90" y="345" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-size="10">192.168.1.102:3422</text>
    
    <!-- Socket connection -->
    <line x1="130" y1="280" x2="350" y2="220" stroke="url(#connectionGrad)" stroke-width="3"/>
    <text x="240" y="255" fill="#10b981" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Socket 2</text>
    
    <!-- Data packets -->
    <circle cx="180" cy="260" r="3" fill="#34d399">
      <animate attributeName="cx" values="130;350;130" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="280;220;280" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Client 3 -->
  <g id="client3">
    <rect x="50" y="420" width="80" height="60" fill="#06b6d4" stroke="#0891b2" stroke-width="2" rx="6"/>
    <rect x="60" y="435" width="60" height="30" fill="#0ea5e9" rx="3"/>
    <text x="90" y="500" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client 3</text>
    <text x="90" y="515" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-size="10">192.168.1.103:3423</text>
    
    <!-- Socket connection -->
    <line x1="130" y1="450" x2="350" y2="250" stroke="url(#connectionGrad)" stroke-width="3"/>
    <text x="240" y="355" fill="#10b981" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Socket 3</text>
    
    <!-- Data packets -->
    <circle cx="180" cy="380" r="3" fill="#34d399">
      <animate attributeName="cx" values="130;350;130" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="450;250;450" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Client 4 -->
  <g id="client4">
    <rect x="670" y="80" width="80" height="60" fill="#06b6d4" stroke="#0891b2" stroke-width="2" rx="6"/>
    <rect x="680" y="95" width="60" height="30" fill="#0ea5e9" rx="3"/>
    <text x="710" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client 4</text>
    <text x="710" y="175" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-size="10">192.168.1.104:3424</text>
    
    <!-- Socket connection -->
    <line x1="670" y1="110" x2="450" y2="190" stroke="url(#connectionGrad)" stroke-width="3"/>
    <text x="560" y="145" fill="#10b981" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Socket 4</text>
    
    <!-- Data packets -->
    <circle cx="620" cy="138" r="3" fill="#34d399">
      <animate attributeName="cx" values="670;450;670" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;190;110" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Client 5 -->
  <g id="client5">
    <rect x="670" y="420" width="80" height="60" fill="#06b6d4" stroke="#0891b2" stroke-width="2" rx="6"/>
    <rect x="680" y="435" width="60" height="30" fill="#0ea5e9" rx="3"/>
    <text x="710" y="500" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client 5</text>
    <text x="710" y="515" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-size="10">192.168.1.105:3425</text>
    
    <!-- Socket connection -->
    <line x1="670" y1="450" x2="450" y2="250" stroke="url(#connectionGrad)" stroke-width="3"/>
    <text x="560" y="355" fill="#10b981" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Socket 5</text>
    
    <!-- Data packets -->
    <circle cx="620" cy="380" r="3" fill="#34d399">
      <animate attributeName="cx" values="670;450;670" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="450;250;450" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="300" y="380" width="200" height="120" fill="rgba(0,0,0,0.7)" stroke="#374151" stroke-width="1" rx="8"/>
    <text x="400" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Legend</text>
    
    <!-- Server legend -->
    <rect x="320" y="410" width="20" height="15" fill="#ef4444" rx="2"/>
    <text x="350" y="422" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">TCP Server</text>
    
    <!-- Client legend -->
    <rect x="320" y="430" width="20" height="15" fill="#06b6d4" rx="2"/>
    <text x="350" y="442" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">TCP Clients</text>
    
    <!-- Socket legend -->
    <line x1="320" y1="455" x2="340" y2="455" stroke="#10b981" stroke-width="3"/>
    <text x="350" y="460" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Socket Connections</text>
    
    <!-- Data legend -->
    <circle cx="330" cy="475" r="4" fill="#34d399"/>
    <text x="350" y="480" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Data Packets</text>
  </g>
  
  <!-- Connection count -->
  <text x="400" y="580" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Active Connections: 5 Sockets</text>
</svg>